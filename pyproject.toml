[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stepsplit"
version = "1.0.0"
description = "Split multi-gigabyte STEP/STP assemblies into smaller files without loading them into CAD or RAM"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Myjestic" }]
requires-python = ">=3.10"
keywords = [
    "step",
    "stp",
    "cad",
    "assembly",
    "ap214",
    "ap242",
    "splitter",
    "fusion360",
    "freecad",
    "brep",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
windows = ["windows-curses"]

[project.urls]
Homepage = "https://github.com/Myjestic/stepsplit"
Repository = "https://github.com/Myjestic/stepsplit"
Issues = "https://github.com/Myjestic/stepsplit/issues"
Changelog = "https://github.com/Myjestic/stepsplit/releases"

[project.scripts]
stepsplit = "stepsplit.__main__:main"

[tool.setuptools.packages.find]
include = ["stepsplit*"]
